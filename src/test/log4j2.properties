# Root Logger Ayarı
rootLogger.level = info
rootLogger.appenderRefs = Console, RollingFile

# Konsola Yazdırma Ayarı
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss} [%t] %c{1} - %msg%n

# Dosyaya (logs/ klasörüne) Yazdırma Ayarı
appender.file.type = RollingFile
appender.file.name = RollingFile
appender.file.fileName = logs/test-automation.log
appender.file.filePattern = logs/archived/test-automation-%d{yyyy-MM-dd}-%i.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss} [%t] %c{1} - %msg%n
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10